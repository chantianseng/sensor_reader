<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>全设备百项参数与传感器遥测引擎</title>
<style>
:root{--bg:#090d13;--panel:#111722;--panel2:#171e2b;--line:#273244;--text:#edf2f7;--muted:#93a0b3;--gold:#d8b36a;--green:#72b08a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:720px;margin:auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px 28px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 20px}
.brand{font-weight:800;letter-spacing:.08em;font-size:18px;flex:1;padding-right:10px;word-break:break-word}
.brand span{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 16px 45px #0005}
.field{background:#0c121b;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input{width:100%;background:transparent;border:0;color:var(--text);font-size:16px;outline:0}
select.secondary{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:14px;font-weight:700;outline:0;cursor:pointer}
select.secondary option{background:var(--panel2);color:var(--text)}
.actions{display:flex;gap:10px;margin-top:16px}
button{border:0;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer}
.primary{background:var(--gold);color:#15110a;flex:1}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);flex:1}
.section-title{font-weight:800;margin:15px 0 10px;font-size:15px;color:var(--gold);display:flex;align-items:center;gap:8px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.result-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;word-break:break-all}
.result-item b{font-size:14px;color:var(--text);word-break:break-all}
.full-span{grid-column:1 / -1}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand" data-i18n="brand">全设备百项参数与传感器遥测引擎</div>
    <div style="display:flex; gap:4px; align-items:center;">
      <button style="width:38px;height:38px;min-width:38px;flex-shrink:0;border:none;background:transparent;border-radius:50%;padding:0;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="openMap()" title="打开地图查看">🌍</button>
      <button id="langBtn" style="width:38px;height:38px;min-width:38px;flex-shrink:0;border:none;background:transparent;border-radius:50%;padding:0;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="toggleLang()" title="Switch Language">🇨🇳</button>
    </div>
  </header>

  <div class="card">
    <div class="actions" style="margin-top:0;">
      <button class="primary" onclick="readAll100Parameters()" data-i18n="btn_scan">读取全部 100 项设备参数</button>
      <button class="secondary" onclick="toggleLiveStream()" id="liveBtn" data-i18n="btn_live">开启实时监控循环</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title" data-i18n="sec_sys">1. 系统核心与性能参数 (1-25)</div>
    <div class="result-grid" id="gridSys">
      <div class="result-item full-span"><small data-i18n="lbl_status">状态</small><b data-i18n="status_ready">等待开始参数采集</b></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title" data-i18n="sec_motion">2. 运动与位置传感器 (26-50)</div>
    <div class="result-grid" id="gridMotion">
      <div class="result-item full-span"><small data-i18n="lbl_status">状态</small><b data-i18n="status_waiting">等待系统初始化...</b></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title" data-i18n="sec_power">3. 能源、热力与硬件状态 (51-75)</div>
    <div class="result-grid" id="gridPower">
      <div class="result-item full-span"><small data-i18n="lbl_status">状态</small><b data-i18n="status_waiting">等待系统初始化...</b></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title" data-i18n="sec_net">4. 网络、显示、音频与外设 (76-100)</div>
    <div class="result-grid" id="gridNet">
      <div class="result-item full-span"><small data-i18n="lbl_status">状态</small><b data-i18n="status_waiting">等待系统初始化...</b></div>
    </div>
  </div>

  <!-- MAP SECTION -->
  <div class="card" id="mapCard" style="display: none;">
    <div class="section-title">GPS Location Map</div>
    <div id="googleMap" style="width: 100%; height: 350px; border-radius: 12px; background: var(--panel2);"></div>
  </div>

</div>

    btn_stop_live: "Stop Live Monitor",
    sec_sys: "1. Core System & Performance (1-25)",
    sec_motion: "2. Motion & Position Sensors (26-50)",

// Global sensor raw holders
let sensorState = {
  accel: {x:0, y:0, z:0},
  gyro: {alpha:0, beta:0, gamma:0},
  gps: {lat: 3.1390, lon: 101.6869, alt: 0, speed: 0, accuracy: 0},
  battery: {level: 100, charging: true, temp: 32},
  orientation: {alpha:0, beta:0, gamma:0}
};

window.addEventListener('devicemotion', (e) => {
  if(e.acceleration) {
    sensorState.accel.x = e.acceleration.x ? e.acceleration.x.toFixed(2) : 0;
    sensorState.accel.y = e.acceleration.y ? e.acceleration.y.toFixed(2) : 0;
    sensorState.accel.z = e.acceleration.z ? e.acceleration.z.toFixed(2) : 0;
  }
});

window.addEventListener('deviceorientation', (e) => {
  sensorState.orientation.alpha = e.alpha ? e.alpha.toFixed(1) : 0;
  sensorState.orientation.beta = e.beta ? e.beta.toFixed(1) : 0;
  sensorState.orientation.gamma = e.gamma ? e.gamma.toFixed(1) : 0;
});

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(pos => {
    sensorState.gps.lat = pos.coords.latitude;
    sensorState.gps.lon = pos.coords.longitude;
    sensorState.gps.alt = pos.coords.altitude || 0;
    sensorState.gps.speed = pos.coords.speed || 0;
    sensorState.gps.accuracy = pos.coords.accuracy || 0;
  }, err => {}, {enableHighAccuracy: true});
}

if (navigator.getBattery) {
  navigator.getBattery().then(bat => {
    sensorState.battery.level = Math.round(bat.level * 100);
    sensorState.battery.charging = bat.charging;
  });
}

window.initGoogleMap = function() {
  const mapElement = document.getElementById('googleMap');
  if (mapElement) {
    googleMap = new google.maps.Map(mapElement, {
      zoom: 14,
      center: { lat: sensorState.gps.lat, lng: sensorState.gps.lon },
      mapTypeId: 'roadmap'
    });
    googleMarker = new google.maps.Marker({
      position: { lat: sensorState.gps.lat, lng: sensorState.gps.lon },
      map: googleMap
    });
  }
};

function updateGoogleMap(lat, lon) {
  if (!googleMap || !googleMarker) return;
  const pos = { lat: parseFloat(lat), lng: parseFloat(lon) };
  googleMap.setCenter(pos);
  googleMarker.setPosition(pos);
}

function openMap() {
  const mapCard = document.getElementById('mapCard');
  mapCard.style.display = mapCard.style.display === 'none' ? 'block' : 'none';
  if(mapCard.style.display === 'block' && googleMap) {
    google.maps.event.trigger(googleMap, 'resize');
    updateGoogleMap(sensorState.gps.lat, sensorState.gps.lon);
  }
}

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  document.getElementById('langBtn').innerText = currentLang === 'zh' ? '🇨🇳' : '🇬🇧';
  updateText();
  if(Object.keys(lastParamsData).length > 0) {
    renderParameters(lastParamsData);
  }
}

function updateText() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[currentLang][key]) el.innerHTML = i18n[currentLang][key];
  });
}

function toggleLiveStream() {
  isLiveActive = !isLiveActive;
  const btn = document.getElementById('liveBtn');
  btn.innerText = isLiveActive ? i18n[currentLang].btn_stop_live : i18n[currentLang].btn_live;
  
  if(isLiveActive) {
    readAll100Parameters();
    liveInterval = setInterval(readAll100Parameters, 5000);
  } else {
    clearInterval(liveInterval);
  }
}

    95: {name: zh ? "操作系统运行时间" : "OS Uptime", val: Math.floor(performance.now() / 1000) + " s"},
    96: {name: zh ? "活跃运行进程数" : "Active Processes", val: "142"},
    97: {name: zh ? "活跃线程总数" : "Active Threads", val: "1,204"},
    98: {name: zh ? "本地局域网 IP" : "Local IP Address", val: "192.168.1.105"},
    99: {name: zh ? "SIM卡就绪状态" : "SIM Card Status", val: "Ready / Active"},
    100: {name: zh ? "设备静音物理开关" : "Device Mute Switch", val: "Unmuted"}
  };

  lastParamsData = p;
  renderParameters(p);
  syncToGitHub(p);
}

function renderParameters(p) {
  let htmlSys = '', htmlMotion = '', htmlPower = '', htmlNet = '';

  for(let i=1; i<=25; i++) {
    htmlSys += `<div class="result-item"><small>[${i}] ${p[i].name}</small><b>${p[i].val}</b></div>`;
  }
  for(let i=26; i<=50; i++) {
    htmlMotion += `<div class="result-item"><small>[${i}] ${p[i].name}</small><b>${p[i].val}</b></div>`;
  }
  for(let i=51; i<=75; i++) {
    htmlPower += `<div class="result-item"><small>[${i}] ${p[i].name}</small><b>${p[i].val}</b></div>`;
  }
  for(let i=76; i<=100; i++) {
    htmlNet += `<div class="result-item"><small>[${i}] ${p[i].name}</small><b>${p[i].val}</b></div>`;
  }

  document.getElementById('gridSys').innerHTML = htmlSys;
  document.getElementById('gridMotion').innerHTML = htmlMotion;
  document.getElementById('gridPower').innerHTML = htmlPower;
  document.getElementById('gridNet').innerHTML = htmlNet;

  updateGoogleMap(sensorState.gps.lat, sensorState.gps.lon);
}

async function syncToGitHub(p) {
  const currentToken = GITHUB_CONFIG.token;
  if (!currentToken || currentToken.includes('YOUR_')) return;

  const timestamp = new Date().toISOString();
  let csvRow = `"${timestamp}"`;
  for(let i=1; i<=100; i++) {
    csvRow += `,"${p[i].val}"`;
  }
  csvRow += "\n";

  let headerCSV = "Timestamp";
  for(let i=1; i<=100; i++) {
    headerCSV += `,Param_${i}_${p[i].name.replace(/,/g, '')}`;
  }
  headerCSV += "\n";

  const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;

  try {
    let sha = null;
    let existingContent = headerCSV;

    const getRes = await fetch(apiUrl, {
      headers: { 'Authorization': `token ${currentToken}` }
    });

    if (getRes.ok) {
      const fileData = await getRes.json();
      sha = fileData.sha;
      const binString = atob(fileData.content);
      const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
      existingContent = new TextDecoder().decode(bytes);
    }

    const updatedContent = existingContent + csvRow;
    const encodedContent = btoa(unescape(encodeURIComponent(updatedContent)));

    await fetch(apiUrl, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${currentToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Telemetry report 100 parameters update at ${timestamp}`,
        content: encodedContent,
        sha: sha ? sha : undefined
      })
    });
  } catch (err) {
    console.error('GitHub sync error:', err);
  }
}
