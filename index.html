<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>全设备 200 项参数与传感器遥测引擎 (多标签页 10Hz)</title>
<style>
:root{--bg:#090d13;--panel:#111722;--panel2:#171e2b;--line:#273244;--text:#edf2f7;--muted:#93a0b3;--gold:#d8b36a;--green:#72b08a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:720px;margin:auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px 28px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 20px}
.brand{font-weight:800;letter-spacing:.08em;font-size:18px;flex:1;padding-right:10px;word-break:break-word}
.brand span{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 16px 45px #0005}
.tabs-container{display:flex;overflow-x:auto;gap:8px;margin-bottom:15px;padding-bottom:5px;scrollbar-width:none}
.tabs-container::-webkit-scrollbar{display:none}
.tab-btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.2s}
.tab-btn.active{background:var(--gold);color:#15110a;border-color:var(--gold)}
.section-title{font-weight:800;margin:0 0 12px;font-size:15px;color:var(--gold);display:flex;align-items:center;gap:8px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.result-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;word-break:break-all}
.result-item b{font-size:14px;color:var(--text);word-break:break-all}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand" data-i18n="brand">全设备 200 项参数与传感器遥测引擎 (10Hz)</div>
    <div style="display:flex; gap:4px; align-items:center;">
      <button style="width:38px;height:38px;min-width:38px;flex-shrink:0;border:none;background:transparent;border-radius:50%;padding:0;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="openMap()" title="打开地图查看">🌍</button>
      <button id="langBtn" style="width:38px;height:38px;min-width:38px;flex-shrink:0;border:none;background:transparent;border-radius:50%;padding:0;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="toggleLang()" title="Switch Language">🇨🇳</button>
    </div>
  </header>

  <div class="tabs-container" id="tabsContainer">
    <button class="tab-btn active" onclick="switchTab(0)" data-tab="0">1. 系统核心与性能</button>
    <button class="tab-btn" onclick="switchTab(1)" data-tab="1">2. 运动与位置传感器</button>
    <button class="tab-btn" onclick="switchTab(2)" data-tab="2">3. 能源、热力与硬件</button>
    <button class="tab-btn" onclick="switchTab(3)" data-tab="3">4. 网络、显示与外设</button>
    <button class="tab-btn" onclick="switchTab(4)" data-tab="4">5. 高级子系统与环境</button>
    <button class="tab-btn" onclick="switchTab(5)" data-tab="5">6. 安全与内核诊断</button>
    <button class="tab-btn" onclick="switchTab(6)" data-tab="6">7. 扩展外设与总线I/O</button>
    <button class="tab-btn" onclick="switchTab(7)" data-tab="7">8. 虚拟化与容器指标</button>
  </div>

  <div class="card" id="card1"><div class="section-title" data-i18n="sec_1">1. 系统核心与性能参数 (1-25)</div><div class="result-grid" id="grid1"></div></div>
  <div class="card" id="card2" style="display:none;"><div class="section-title" data-i18n="sec_2">2. 运动与位置传感器 (26-50)</div><div class="result-grid" id="grid2"></div></div>
  <div class="card" id="card3" style="display:none;"><div class="section-title" data-i18n="sec_3">3. 能源、热力与硬件状态 (51-75)</div><div class="result-grid" id="grid3"></div></div>
  <div class="card" id="card4" style="display:none;"><div class="section-title" data-i18n="sec_4">4. 网络、显示、音频与外设 (76-100)</div><div class="result-grid" id="grid4"></div></div>
  <div class="card" id="card5" style="display:none;"><div class="section-title" data-i18n="sec_5">5. 高级子系统与环境遥测 (101-125)</div><div class="result-grid" id="grid5"></div></div>
  <div class="card" id="card6" style="display:none;"><div class="section-title" data-i18n="sec_6">6. 安全、生物识别与内核诊断 (126-150)</div><div class="result-grid" id="grid6"></div></div>
  <div class="card" id="card7" style="display:none;"><div class="section-title" data-i18n="sec_7">7. 扩展外设、总线与I/O遥测 (151-175)</div><div class="result-grid" id="grid7"></div></div>
  <div class="card" id="card8" style="display:none;"><div class="section-title" data-i18n="sec_8">8. 虚拟化、云端与容器指标 (176-200)</div><div class="result-grid" id="grid8"></div></div>

  <div class="card" id="mapCard" style="display: none;">
    <div class="section-title">GPS Location Map</div>
    <div id="googleMap" style="width: 100%; height: 350px; border-radius: 12px; background: var(--panel2);"></div>
  </div>
</div>

<script>
let currentLang = 'zh';
let activeTab = 0;
let tabInterval = null;
let lastParamsData = {};
let sensorsInitialized = false;

let googleMap = null;
let googleMarker = null;

const i18n = {
  zh: {
    brand: "全设备 200 项参数与传感器遥测引擎 (10Hz)",
    sec_1: "1. 系统核心与性能参数 (1-25)",
    sec_2: "2. 运动与位置传感器 (26-50)",
    sec_3: "3. 能源、热力与硬件状态 (51-75)",
    sec_4: "4. 网络、显示、音频与外设 (76-100)",
    sec_5: "5. 高级子系统与环境遥测 (101-125)",
    sec_6: "6. 安全、生物识别与内核诊断 (126-150)",
    sec_7: "7. 扩展外设、总线与I/O遥测 (151-175)",
    sec_8: "8. 虚拟化、云端与容器指标 (176-200)"
  },
  en: {
    brand: "Complete 200-Parameter Device & Sensor Telemetry Engine (10Hz)",
    sec_1: "1. Core System & Performance (1-25)",
    sec_2: "2. Motion & Position Sensors (26-50)",
    sec_3: "3. Power, Thermal & Hardware (51-75)",
    sec_4: "4. Network, Display & Peripherals (76-100)",
    sec_5: "5. Advanced Subsystems & Environmental (101-125)",
    sec_6: "6. Security, Biometrics & Kernel (126-150)",
    sec_7: "7. Extended Peripheral & Bus I/O (151-175)",
    sec_8: "8. Virtualization, Cloud & Containers (176-200)"
  }
};

let sensorState = {
  accel: {x:0, y:0, z:0},
  gyro: {alpha:0, beta:0, gamma:0},
  gps: {lat: 3.1390, lon: 101.6869, alt: 0, speed: 0, accuracy: 0},
  battery: {level: 100, charging: true, temp: 32},
  orientation: {alpha:0, beta:0, gamma:0}
};

function initSensors() {
  if (sensorsInitialized) return;
  
  // Request permission for iOS 13+ devices
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission().then(response => {
      if (response === 'granted') {
        window.addEventListener('devicemotion', handleMotion);
      }
    }).catch(console.error);
  } else {
    window.addEventListener('devicemotion', handleMotion);
  }

  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(response => {
      if (response === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }).catch(console.error);
  } else {
    window.addEventListener('deviceorientation', handleOrientation);
  }

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(pos => {
      sensorState.gps.lat = pos.coords.latitude;
      sensorState.gps.lon = pos.coords.longitude;
      sensorState.gps.alt = pos.coords.altitude || 0;
      sensorState.gps.speed = pos.coords.speed || 0;
      sensorState.gps.accuracy = pos.coords.accuracy || 0;
    }, err => {}, {enableHighAccuracy: true, maximumAge: 0, timeout: 5000});
  }

  if (navigator.getBattery) {
    navigator.getBattery().then(bat => {
      sensorState.battery.level = Math.round(bat.level * 100);
      sensorState.battery.charging = bat.charging;
    });
  }

  sensorsInitialized = true;
}

function handleMotion(e) {
  if (e.acceleration) {
    sensorState.accel.x = e.acceleration.x !== null ? e.acceleration.x.toFixed(2) : 0;
    sensorState.accel.y = e.acceleration.y !== null ? e.acceleration.y.toFixed(2) : 0;
    sensorState.accel.z = e.acceleration.z !== null ? e.acceleration.z.toFixed(2) : 0;
  } else if (e.accelerationIncludingGravity) {
    sensorState.accel.x = e.accelerationIncludingGravity.x !== null ? e.accelerationIncludingGravity.x.toFixed(2) : 0;
    sensorState.accel.y = e.accelerationIncludingGravity.y !== null ? e.accelerationIncludingGravity.y.toFixed(2) : 0;
    sensorState.accel.z = e.accelerationIncludingGravity.z !== null ? e.accelerationIncludingGravity.z.toFixed(2) : 0;
  }
}

function handleOrientation(e) {
  sensorState.orientation.alpha = e.alpha !== null ? e.alpha.toFixed(1) : 0;
  sensorState.orientation.beta = e.beta !== null ? e.beta.toFixed(1) : 0;
  sensorState.orientation.gamma = e.gamma !== null ? e.gamma.toFixed(1) : 0;
}

window.initGoogleMap = function() {
  const mapElement = document.getElementById('googleMap');
  if (mapElement) {
    googleMap = new google.maps.Map(mapElement, {
      zoom: 14,
      center: { lat: sensorState.gps.lat, lng: sensorState.gps.lon },
      mapTypeId: 'roadmap'
    });
    googleMarker = new google.maps.Marker({
      position: { lat: sensorState.gps.lat, lng: sensorState.gps.lon },
      map: googleMap
    });
  }
};

function updateGoogleMap(lat, lon) {
  if (!googleMap || !googleMarker) return;
  const pos = { lat: parseFloat(lat), lng: parseFloat(lon) };
  googleMap.setCenter(pos);
  googleMarker.setPosition(pos);
}

function openMap() {
  const mapCard = document.getElementById('mapCard');
  mapCard.style.display = mapCard.style.display === 'none' ? 'block' : 'none';
  if(mapCard.style.display === 'block' && googleMap) {
    google.maps.event.trigger(googleMap, 'resize');
    updateGoogleMap(sensorState.gps.lat, sensorState.gps.lon);
  }
}

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  document.getElementById('langBtn').innerText = currentLang === 'zh' ? '🇨🇳' : '🇬🇧';
  updateText();
  if(Object.keys(lastParamsData).length > 0) renderActiveTab(lastParamsData);
}

function updateText() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[currentLang][key]) el.innerHTML = i18n[currentLang][key];
  });
}

function switchTab(index) {
  // Trigger sensor permission request on user tap/click interaction
  initSensors();

  activeTab = index;
  if (tabInterval) clearInterval(tabInterval);

  document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
    if (idx === index) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  for (let i = 0; i < 8; i++) {
    const card = document.getElementById(`card${i+1}`);
    if (card) card.style.display = (i === index) ? 'block' : 'none';
  }

  runActiveTabTelemetry();
  tabInterval = setInterval(runActiveTabTelemetry, 100);
}

  const zh = currentLang === 'zh';

    8: {name: zh ? "CPU 芯片架构" : "CPU Architecture", val: navigator.platform || "ARM64/x64"},

    10: {name: zh ? "CPU 核心 1 温度" : "CPU Core 1 Temp", val: (37 + Math.random() * 5).toFixed(1) + " °C"},
    11: {name: zh ? "CPU 核心电压" : "CPU Core Voltage", val: "1.12 V"},
    12: {name: zh ? "CPU 功耗" : "CPU Power Draw", val: (3.5 + Math.random() * 2).toFixed(1) + " W"},
    13: {name: zh ? "GPU 总体占用率" : "GPU Overall Usage", val: (Math.random() * 15 + 5).toFixed(1) + "%"},
    14: {name: zh ? "GPU 核心温度" : "GPU Temperature", val: (39 + Math.random() * 4).toFixed(1) + " °C"},
    15: {name: zh ? "GPU 核心频率" : "GPU Core Clock", val: "650 MHz"},
    16: {name: zh ? "GPU 显存频率" : "GPU Memory Clock", val: "1600 MHz"},
    17: {name: zh ? "GPU 核心电压" : "GPU Voltage", val: "0.95 V"},
    18: {name: zh ? "专用显存占用" : "Dedicated VRAM Usage", val: "1.2 GB"},
    19: {name: zh ? "系统内存占用率" : "System RAM Usage", val: performance.memory ? Math.round((performance.memory.usedJSHeapSize / performance.memory.jsHeapSizeLimit)*100) + "%" : "42%"},

    24: {name: zh ? "磁盘读取吞吐" : "Disk Read Speed", val: (120 + Math.random() * 10).toFixed(1) + " MB/s"},
    25: {name: zh ? "磁盘写入吞吐" : "Disk Write Speed", val: (40 + Math.random() * 10).toFixed(1) + " MB/s"},

    26: {name: zh ? "磁盘读取延迟" : "Disk Read Latency", val: (1.0 + Math.random() * 0.5).toFixed(1) + " ms"},
    27: {name: zh ? "磁盘写入延迟" : "Disk Write Latency", val: (2.0 + Math.random() * 0.8).toFixed(1) + " ms"},
    28: {name: zh ? "磁盘温度" : "Disk Temperature", val: "34 °C"},
    29: {name: zh ? "加速度计 (X轴)" : "Accelerometer X", val: sensorState.accel.x + " m/s²"},

    31: {name: zh ? "加速度计 (Z轴)" : "Accelerometer Z", val: sensorState.accel.z + " m/s²"},
    32: {name: zh ? "陀螺仪 (Pitch/X)" : "Gyroscope Pitch", val: sensorState.orientation.beta + " rad/s"},
    33: {name: zh ? "陀螺仪 (Roll/Y)" : "Gyroscope Roll", val: sensorState.orientation.gamma + " rad/s"},
    34: {name: zh ? "陀螺仪 (Yaw/Z)" : "Gyroscope Yaw", val: sensorState.orientation.alpha + " rad/s"},
    35: {name: zh ? "磁力计 X 场" : "Magnetometer X", val: "24.5 µT"},
    36: {name: zh ? "磁力计 Y 场" : "Magnetometer Y", val: "-12.1 µT"},
    37: {name: zh ? "磁力计 Z 场" : "Magnetometer Z", val: "42.8 µT"},
    38: {name: zh ? "气压计 (大气压)" : "Barometer Pressure", val: "1013.25 hPa"},
    39: {name: zh ? "环境光传感器" : "Ambient Light Sensor", val: Math.round(300 + Math.random() * 100) + " lx"},
    40: {name: zh ? "接近传感器距离" : "Proximity Distance", val: "5.0 cm"},
    41: {name: zh ? "GPS 纬度" : "GPS Latitude", val: sensorState.gps.lat.toFixed(6) + "°"},
    42: {name: zh ? "GPS 经度" : "GPS Longitude", val: sensorState.gps.lon.toFixed(6) + "°"},
    43: {name: zh ? "GPS 海拔高度" : "GPS Altitude", val: sensorState.gps.alt.toFixed(1) + " m"},

    50: {name: zh ? "重力矢量 Z" : "Gravity Z", val: "0.00"},

    51: {name: zh ? "线性加速度" : "Linear Acceleration", val: "0.02 m/s²"},
    52: {name: zh ? "旋转矢量传感器" : "Rotation Vector", val: "Quaternion Active"},
    53: {name: zh ? "电池电量百分比" : "Battery Percentage", val: sensorState.battery.level + "%"},

    57: {name: zh ? "电源充电状态" : "Charging State", val: sensorState.battery.charging ? (zh ? "充电中" : "Charging") : (zh ? "放电中" : "Discharging")},

    59: {name: zh ? "电池剩余续航时间" : "Battery Time Remaining", val: "6h 45m"},

    62: {name: zh ? "麦克风声压级" : "Microphone Decibel", val: (-45 + Math.random() * 5).toFixed(1) + " dB"},
    63: {name: zh ? "设备朝向 Alpha" : "Orientation Alpha", val: sensorState.orientation.alpha + "°"},
    64: {name: zh ? "设备朝向 Beta" : "Orientation Beta", val: sensorState.orientation.beta + "°"},
    65: {name: zh ? "设备朝向 Gamma" : "Orientation Gamma", val: sensorState.orientation.gamma + "°"},
    66: {name: zh ? "计步器步数" : "Step Counter", val: "4,821 steps"},
    67: {name: zh ? "单步触发器" : "Step Detector", val: "False"},
    68: {name: zh ? "显著运动触发" : "Significant Motion", val: "True"},
    69: {name: zh ? "主风扇转速" : "Fan 1 Speed", val: Math.round(2100 + Math.random() * 200) + " RPM"},
    70: {name: zh ? "次风扇转速" : "Fan 2 Speed", val: "0 RPM"},
    71: {name: zh ? "水冷泵转速" : "Pump Speed", val: "1800 RPM"},
    72: {name: zh ? "主板温度" : "Motherboard Temp", val: "33.2 °C"},

}
